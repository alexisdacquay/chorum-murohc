[project]
name = "chorum-murohc"
version = "0.1.0"
description = "A gamified household chore-management application."
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-django>=4.14.0,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
