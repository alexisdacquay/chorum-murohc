name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python:3.13.12-slim-bookworm@sha256:a58daefb915e1e03ad48f3ca4df8832065412c5c35cacb9d39f4229184de12b6
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: t017-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-synthetic
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI_POSTGRES_TARGET: ci_${{ github.run_id }}_${{ github.run_attempt }}_backend01
      CI_POSTGRES_HOST: postgres
      CI_POSTGRES_PORT: '5432'
      CI_POSTGRES_EXPECTED_VERSION: '17.11'
      CI_POSTGRES_BOOTSTRAP_ROLE: postgres
      CI_POSTGRES_BOOTSTRAP_DATABASE: postgres
      CI_POSTGRES_BASE_DATABASE: chorum_murohc_ci_${{ github.run_id }}_${{ github.run_attempt }}_backend01
      CI_POSTGRES_TEST_DATABASE: test_chorum_murohc_ci_${{ github.run_id }}_${{ github.run_attempt }}_backend01
      CI_POSTGRES_RESTRICTED_ROLE: chorum_murohc_ci_${{ github.run_id }}_${{ github.run_attempt }}_backend01
      DJANGO_ENVIRONMENT: development
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_TARGET: ci_${{ github.run_id }}_${{ github.run_attempt }}_backend01
      DJANGO_DB_NAME: chorum_murohc_ci_${{ github.run_id }}_${{ github.run_attempt }}_backend01
      DJANGO_DB_USER: chorum_murohc_ci_${{ github.run_id }}_${{ github.run_attempt }}_backend01
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: '5432'
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          enable-cache: false
          github-token: ''

      - name: Report exact Python version
        run: python --version

      - name: Report exact uv version
        run: uv --version

      - name: Install locked backend dependencies
        run: uv sync --locked

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Prepare isolated PostgreSQL
        run: uv run --locked python .github/scripts/ci_postgresql.py prepare
        env:
          CI_POSTGRES_BOOTSTRAP_PASSWORD: t017-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-synthetic
          DJANGO_DB_PASSWORD: t017-restricted-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-synthetic

      - name: Run Django system checks
        run: uv run --locked python manage.py check
        env:
          DJANGO_DB_PASSWORD: t017-restricted-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-synthetic

      - name: Check migration drift
        run: uv run --locked python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DB_PASSWORD: t017-restricted-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-synthetic

      - name: Run backend tests
        run: uv run --locked pytest
        env:
          DJANGO_DB_PASSWORD: t017-restricted-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-synthetic

      - name: Clean isolated PostgreSQL resources
        if: ${{ always() }}
        run: uv run --locked python .github/scripts/ci_postgresql.py cleanup
        env:
          CI_POSTGRES_BOOTSTRAP_PASSWORD: t017-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-synthetic
          CI_POSTGRES_EXPECT_DJANGO_CLEANUP: ${{ job.status == 'success' }}

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          runtime: node@24.15.0
          working-directory: frontend
          cache: false
          install: false

      - name: Report exact Node.js version
        run: node --version

      - name: Report exact pnpm version
        run: pnpm --version

      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Build frontend
        run: pnpm --dir frontend build
